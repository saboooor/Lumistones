# Paper 1.21.10+, Java 21. Costs accept levels, money, or both.
# Money requires Vault and an economy provider. Omitted currencies cost zero.
xp:
  enabled: true
  blocks-per-level: 1000
  blocks-per-money: 1000
  minimum-cost:
    levels: 1
  maximum-cost:
    levels: 3
  # Flat cost when travelling to another world/dimension.
  cross-dimension-cost:
    levels: 3
# Only listed world folder names allow waystone placement and use.
# Each entry also defines its teleport-menu name and sprite.
enabled-worlds:
  # Sprites use the blocks atlas on 1.21.10 and items atlas on 1.21.11+.
  # An empty sprite disables the icon.
  world:
    name: Overworld
    sprite: minecraft:item/compass_16
  world_nether:
    name: Nether
    sprite: minecraft:item/nether_star
  world_the_end:
    name: The End
    sprite: minecraft:item/ender_eye
scroll:
  enabled: true
  uses-cost: false
teleport:
  # Enable /lumistones and /lumistones tp travel from anywhere.
  command-travel: false
  cross-world: true
  # Require each player to enter a world once before travelling there, even to global stones.
  # Visits are saved across restarts and tracked even while this option is false.
  require-world-discovery: false
  cooldown-seconds: 0
  warmup-seconds: 0
# Private stones can only be activated and used by their owner.
waystones:
  # Allow discovery and travel menus when GriefPrevention or another protection
  # plugin denies clicks. Editing, management, and breaking still respect protection.
  bypass-claim-protection: true
  # Enchantment shimmer on crafted/given/retrieved Lumistone items.
  item-glint: true
  # Number of stacked breakable wall blocks; 1–16. Applies to new stones.
  anchor-height: 2
  private-by-default: false
  public:
    enabled: false
    # Charged each time a discoverable/private stone is made public.
    cost:
      levels: 3
      money: 0
# One chance per structure in terrain generated while Lumistones is installed.
natural-generation:
  enabled: true
  # Empty means all worlds; otherwise use world folder names.
  worlds: []
  # Percentages (0 disables, 100 always attempts). Add any vanilla/datapack structure key.
  structures:
    minecraft:village_plains: 25
    minecraft:village_desert: 25
    minecraft:village_savanna: 25
    minecraft:village_snowy: 25
    minecraft:village_taiga: 25
    minecraft:desert_pyramid: 15
    minecraft:jungle_pyramid: 15
    minecraft:pillager_outpost: 10
    minecraft:ancient_city: 10
    minecraft:end_city: 10
effects:
  enchantment-particles: true
  teleport-particles: true
  teleport-title: true
model:
  # Native parts are editable in model.yml. Optional resource-pack model overrides its parts.
  custom-model-data: 0
  item-material: AMETHYST_SHARD
  # Visibility is toggled separately in each waystone's settings menu.
  owner-head:
    # Height above the waystone's base and display scale.
    height: 2.5
    scale: 0.75
# Placement, crafting, and interaction settings.
waystone-material: LODESTONE
minimum-distance-blocks: 64
require-sneak-to-manage: true
teleport-sound: ENTITY_ENDERMAN_TELEPORT
recipe:
  enabled: true
  shape: [" S ", "SES", "OOO"]
  ingredients:
    S: STONE_BRICKS
    E: ENDER_PEARL
    O: OBSIDIAN
flight-zone:
  material: SEA_LANTERN
  default-width: 32
  default-height: 32
  max-width: 256
  max-height: 320
  check-interval-ticks: 10
  fall-damage-grace-seconds: 5
  announce: true
give-amount: 1
messages:
  prefix: '&d[Lumistones] &7'

